component: venture_characteristics
version: 1.0.0
role: extractor
deterministic: true
description: >
  The ventures' characteristics from the applications sheet (design, A5), as
  indicators: type of company, types of product, fields (those chosen by enough entries),
  milestones reached, whether a legal entity was formed and of what kind, and whether the team
  gave a website. Only the form's fixed choices are used; the type of legal entity, a free-text
  answer, is reduced to a few categories and its text is not kept.
typed:
  inputs:
    entries:
      kind: table
      meaning: The entries table's columns from the application form
      fields:
        entry: Entry code
        company_type: Type of company, as chosen
        product_type: Types of product, as chosen
        fields: Fields or tags, as chosen
        milestones: Milestones reached, as chosen
        entity_formed: Whether a legal entity has been formed
        entity_type: Type of legal entity, as written
        has_website: Whether the team gave a website
  outputs:
    characteristics:
      kind: table
      meaning: One row per entry; columns as named in the settings, plus one per field chosen by enough entries
    common_fields:
      kind: json
      meaning: The fields chosen by enough entries to have their own column
pinned:
  code: [component.py]
  tools:
    pandas: 3.0.6
  settings:
    internet_company_type: Internet and Consumer Technology
    product_types: [Software/App, Physical Product, Data/Analytics, Service, Electronic Hardware, Local Business,
                    Education/Training, Consulting, Perishables, Other]
    milestones: [Core business concept defined, Prototype/MVP built, Company registered/incorporated,
                 First external users on the product, Funding raised, First client has paid]
    min_entries_per_field: 10
persisted:
  key: inputs_hash+config_hash
  regenerate: never
validated:
  status: validated
  population: The applications of the competition, 2019 form
  checks:
    - name: Unit tests on synthetic answers
      kind: unit_tests
      threshold: all pass
      result: pass
      evidence: tests/test_phase5.py
card: card.md
