component: embedder_qwen3
version: 1.0.0
role: representer
deterministic: true
description: >
  Embeds texts with Qwen/Qwen3-Embedding-8B at a pinned commit, an instruction-following embedding model built on Qwen3 (Zhang et al. 2025), 4,096 dimensions, last-token pooling. Each text is encoded alone, on a GPU of a
  pinned type with deterministic settings, so its vector can be re-executed exactly; vectors are
  L2-normalized. The vectors go to the store as one matrix, in the order of the texts.
typed:
  inputs:
    texts:
      kind: table
      meaning: The texts to embed, with unique ids
      fields:
        id: A unique id
        text: The text
  outputs:
    vectors:
      kind: matrix
      meaning: One vector per text, in the order of the texts
      model: Qwen/Qwen3-Embedding-8B@1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      instruction: "Instruct: Represent the strengths and weaknesses of a business venture that this text describes or evaluates\nQuery:"
      postprocessing: L2-normalized; float32
    ids:
      kind: json
      meaning: The texts' ids, in the order of the vectors
    dimension:
      kind: integer
      meaning: The vectors' dimension
    truncated:
      kind: integer
      meaning: Texts longer than the maximum sequence length, cut at it
pinned:
  code: [component.py, ../shared/embedder.py, ../../pipeline/modal_embed.py, ../../pipeline/models.py]
  model:
    provider: Modal
    id: Qwen/Qwen3-Embedding-8B
    revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
    licence: Apache-2.0
    engine: sentence-transformers 6.1.0, transformers 5.19.0, torch 2.14.1, deterministic algorithms, one text at a time
    gpu: L40S
  tools:
    modal: 1.6.1
  settings:
    dtype: bfloat16
    max_seq_length: 8192
    instruction: "Instruct: Represent the strengths and weaknesses of a business venture that this text describes or evaluates\nQuery:"
    texts_per_call: 500
persisted:
  key: inputs_hash+config_hash
  regenerate: never
validated:
  status: provisional
  population: Executive summaries and feedback of the competition's round 1, 2019
  checks:
    - name: Re-execution gives identical vectors
      kind: determinism
      metric: share of texts whose vectors are bit-identical when embedded again in a new container
      threshold: "1.0"
      result: "pass: the 161 summaries embedded again in a new container gave bit-identical vectors"
      evidence: data/reports/2019_embedding_reexecution.json; the rerun is recorded beside the stored output
    - name: Agreement with the other embedders on pairwise distances
      kind: agreement
      metric: Spearman correlation of pairwise cosine similarities with each other embedder's
      threshold: reported (design, Section 3); validation against human similarity ratings is future work
      result: "reported: with bge-m3 0.66 on feedback and 0.47 on summaries; with gte-modernbert 0.63 and 0.54"
      evidence: the embedding agreement component's output; data/reports/2019_study_a_report.md, Section 4
card: card.md
